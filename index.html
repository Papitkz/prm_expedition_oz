<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://cdn.freebiesupply.com/logos/large/2x/expedition-1-logo-png-transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Basic SEO -->
    <title>Expedition OZ | Luxury Live-Aboard Ningaloo Reef Tours</title>
    <meta name="description" content="Expedition OZ – Luxury live-aboard experiences in Ningaloo Reef, Western Australia. Explore the world's greatest marine wilderness aboard Sylvia (4-day) or Millenium (7-day)." />
    <meta name="keywords" content="Ningaloo Reef tours, live-aboard Western Australia, luxury whale shark tours, Exmouth snorkeling, coral bay diving, Expedition OZ" />
    <meta name="author" content="Expedition OZ" />
    <meta name="robots" content="index, follow" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://expeditionoz.netlify.app/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://expeditionoz.netlify.app/" />
    <meta property="og:title" content="Expedition OZ | Luxury Live-Aboard Ningaloo Reef Tours" />
    <meta property="og:description" content="Luxury live-aboard experiences in Ningaloo Reef, Western Australia. Explore the world's greatest marine wilderness aboard Sylvia or Millenium." />
    <meta property="og:image" content="https://expeditionoz.netlify.app/og-image.jpg" />
    <meta property="og:site_name" content="Expedition OZ" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://expeditionoz.netlify.app/" />
    <meta name="twitter:title" content="Expedition OZ | Luxury Live-Aboard Ningaloo Reef Tours" />
    <meta name="twitter:description" content="Luxury live-aboard experiences in Ningaloo Reef, Western Australia." />
    <meta name="twitter:image" content="https://expeditionoz.netlify.app/og-image.jpg" />
    
    <!-- Structured Data - LocalBusiness/TravelAgency -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Expedition OZ",
      "url": "https://expeditionoz.netlify.app",
      "logo": "https://cdn.freebiesupply.com/logos/large/2x/expedition-1-logo-png-transparent.png",
      "description": "Luxury live-aboard experiences in Ningaloo Reef, Western Australia",
      "areaServed": {
        "@type": "Place",
        "name": "Ningaloo Reef, Western Australia"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Expedition Tours",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Product",
              "name": "Sylvia 4-Day Expedition",
              "description": "4-day luxury live-aboard expedition"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Product",
              "name": "Millenium 7-Day Expedition",
              "description": "7-day luxury live-aboard expedition"
            }
          }
        ]
      }
    }
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
