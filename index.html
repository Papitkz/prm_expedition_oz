<!doctype html>
<html lang="en">
  <head>

    <!-- Core SEO -->

    <link rel="canonical" href="https://expeditionoz.netlify.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://expeditionoz.netlify.app/" />
    <meta property="og:title" content="Luxury Live-Aboard Ningaloo Reef Tours | Expedition OZ" />
    <meta property="og:description" content="Experience luxury live-aboard expeditions on Ningaloo Reef. Swim with whale sharks, snorkel coral gardens aboard Sylvia or Millenium. Departures from Exmouth, WA." />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.freebiesupply.com" crossorigin />

    <!-- Fonts -->

    <!-- Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Expedition OZ",
      "alternateName": ["ExpeditionOZ", "Expeditionoz"],
      "url": "https://expeditionoz.netlify.app/",
      "logo": "https://cdn.freebiesupply.com/logos/large/2x/expedition-1-logo-png-transparent.png",
      "description": "Premier luxury live-aboard expedition company in Ningaloo Reef, Western Australia.",
      "sameAs": [
        "https://www.facebook.com/ExpeditionOz",
        "https://www.instagram.com/ExpeditionOz"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+61-234-567-890",
        "contactType": "reservations",
        "areaServed": "AU",
        "availableLanguage": ["English"]
      }
    }
    </script>

    <!-- LocalBusiness / TravelAgency Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Expedition OZ",
      "url": "https://expeditionoz.netlify.app/",
      "logo": "https://cdn.freebiesupply.com/logos/large/2x/expedition-1-logo-png-transparent.png",
      "description": "Luxury live-aboard tours in Ningaloo Reef departing from Exmouth, Western Australia.",
      "telephone": "+61-234-567-890",
      "email": "info@expeditionoz.com.au",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Your Street Address",
        "addressLocality": "Exmouth",
        "addressRegion": "WA",
        "postalCode": "6707",
        "addressCountry": "AU"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "-21.9315",
        "longitude": "114.1280"
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "08:00",
        "closes": "17:00"
      },
      "priceRange": "$$$$",
      "areaServed": {
        "@type": "Place",
        "name": "Ningaloo Reef, Western Australia"
      }
    }
    </script>

    <!-- Product List Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Expedition OZ Live-Aboard Expeditions",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "item": {
            "@type": "Product",
            "name": "Sylvia 4-Day Northern Reef Expedition",
            "description": "Intimate luxury live-aboard in the northern Ningaloo Reef",
            "brand": { "@type": "Brand", "name": "Expedition OZ" },
            "offers": {
              "@type": "Offer",
              "price": "2495.00",
              "priceCurrency": "AUD",
              "availability": "https://schema.org/InStock",
              "priceValidUntil": "2026-12-31",
              "url": "https://expeditionoz.netlify.app/expeditions/sylvia",
              "seller": { "@type": "Organization", "name": "Expedition OZ" }
            },
            "aggregateRating": {
              "@type": "AggregateRating",
              "ratingValue": "4.8",
              "reviewCount": "93"
            }
          }
        },
        {
          "@type": "ListItem",
          "position": 2,
          "item": {
            "@type": "Product",
            "name": "Millenium 7-Day Full Reef Expedition",
            "description": "Ultimate 7-day full Ningaloo Reef live-aboard",
            "brand": { "@type": "Brand", "name": "Expedition OZ" },
            "offers": {
              "@type": "Offer",
              "price": "2495.00",
              "priceCurrency": "AUD",
              "availability": "https://schema.org/InStock",
              "priceValidUntil": "2026-12-31",
              "url": "https://expeditionoz.netlify.app/expeditions/millenium",
              "seller": { "@type": "Organization", "name": "Expedition OZ" }
            },
            "aggregateRating": {
              "@type": "AggregateRating",
              "ratingValue": "4.8",
              "reviewCount": "93"
            }
          }
        }
      ]
    }
    </script>

    <!-- WebSite Schema with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Expedition OZ",
      "url": "https://expeditionoz.netlify.app/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://expeditionoz.netlify.app/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
